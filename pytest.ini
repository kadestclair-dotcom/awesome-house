[pytest]
testpaths = tests
addopts = -ra
markers =
    gui: opens the real window app (needs a screen)
    realdata: uses the QuestieDB index and saved character on this PC (skipped when missing)
filterwarnings =
    ignore:Exception ignored in.*Variable.__del__:pytest.PytestUnraisableExceptionWarning
    ignore:Exception ignored in.*Image.__del__:pytest.PytestUnraisableExceptionWarning
