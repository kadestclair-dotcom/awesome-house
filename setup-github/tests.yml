# Runs the test suite on GitHub's Windows machine for every push and pull request,
# so a broken change shows a red X on the commit before anyone builds a release from it.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run the tests
        run: python -m pytest
